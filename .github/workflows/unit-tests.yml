name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pipenv

      - name: Install pipenv
        run: python -m pip install --upgrade pipenv

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Run flake8
        run: pipenv run python -m flake8 .

      - name: Run mypy
        run: >
          pipenv run python -m mypy
          paf/docker_runtime.py
          paf/yaml_config.py

      - name: Run unit tests
        run: pipenv run python -m pytest -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
